[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # The admin-account storage (Netlify Blobs) needs Node 22 or newer
  NODE_VERSION = "22"

# Admin login page: yoursite.netlify.app/admin serves the same page, opened to the admin login
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/index.html"
  status = 200
